[project]
name = "immigration-rhetoric"
version = "1.0.0"
description = "Measuring sentiment towards immigration in UK parliamentary speeches"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adjusttext>=1.3.0",
    "arviz>=0.21,<1",
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "build>=1.2",
    "en-core-web-lg",
    "krippendorff>=0.6",
    "matplotlib>=3.11.2",
    "nltk>=3.9.2",
    "numpy<2",
    "openai>=3.19.2",
    "pandas>=3.0.6",
    "pymc>=5.24,<6",
    "python-ternary>=1.0.8",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13",
    "spacy[lookups,transformers]>=3.7.2,<3.8.0",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "thinc-apple-ops>=0.1.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pytest>=8.0",
]
cuda = [
    "cupy-cuda12x>=13.5.1,<13.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immigration_rhetoric"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl" }
